<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lesson Secretary</title>
<style>
  :root {
    --border: #d8dee4;
    --bg: #f7f8fa;
    --card: #ffffff;
    --accent: #2563eb;
    --accent-light: #eaf1ff;
    --text: #1f2430;
    --muted: #6b7280;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px;
  }

  .assistant-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .assistant-box form { display: flex; gap: 8px; }
  .assistant-box input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .assistant-box button {
    padding: 10px 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .assistant-box button:disabled { opacity: 0.6; cursor: default; }
  .assistant-reply {
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--accent-light);
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .assistant-reply.show { display: block; }
  .assistant-reply.error { background: #fdecea; color: var(--danger); }
  .assistant-usage {
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .assistant-usage.low { color: var(--danger); }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }
  .day-col {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    min-height: 140px;
  }
  .day-col h3 {
    margin: 0 0 8px;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .lesson-card {
    background: var(--accent-light);
    border-radius: 6px;
    padding: 6px 8px;
    margin-bottom: 6px;
    font-size: 0.82rem;
  }
  .lesson-card .time { font-weight: 600; }
  .lesson-card .student { display: block; }
  .lesson-card .subject { color: var(--muted); font-size: 0.78rem; }
  .empty { color: var(--muted); font-size: 0.8rem; }

  .load-error {
    background: #fdecea;
    color: var(--danger);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }
  .load-error.show { display: block; }

  @media (max-width: 800px) {
    .calendar { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1>Lesson Secretary</h1>
  <p>Weekly lesson schedule. Ask the assistant below to add, cancel, or check a lesson.</p>
</header>

<main>
  <div class="load-error" id="load-error"></div>

  <div class="assistant-box">
    <form id="assistant-form">
      <input type="text" id="assistant-input" placeholder='e.g. "add algebra with Sam every Tuesday 4-5pm"' autocomplete="off" />
      <button type="submit" id="assistant-submit">Send</button>
    </form>
    <div class="assistant-reply" id="assistant-reply"></div>
    <div class="assistant-usage" id="assistant-usage"></div>
  </div>

  <div class="calendar" id="calendar"></div>
</main>

<script>
const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

function formatTime(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function showLoadError(message) {
  const el = document.getElementById("load-error");
  el.textContent = message;
  el.classList.add("show");
}

function clearLoadError() {
  document.getElementById("load-error").classList.remove("show");
}

async function fetchLessons() {
  const res = await fetch("/api/lessons");
  const data = await res.json();
  if (!res.ok) {
    throw new Error(data.detail || data.error || `Failed to load lessons (HTTP ${res.status})`);
  }
  return data;
}

function renderCalendar(data) {
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const byDay = {};
  for (let i = 0; i < 7; i++) byDay[i] = [];

  data.lessons
    .filter((l) => l.active !== false)
    .forEach((l) => byDay[l.day_of_week].push(l));

  for (let i = 0; i < 7; i++) byDay[i].sort((a, b) => a.start_time.localeCompare(b.start_time));

  DAY_NAMES.forEach((name, idx) => {
    const col = document.createElement("div");
    col.className = "day-col";
    const heading = document.createElement("h3");
    heading.textContent = name;
    col.appendChild(heading);

    const lessons = byDay[idx];
    if (lessons.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No lessons";
      col.appendChild(empty);
    } else {
      lessons.forEach((l) => {
        const card = document.createElement("div");
        card.className = "lesson-card";
        card.innerHTML = `
          <span class="time">${formatTime(l.start_time)}–${formatTime(l.end_time)}</span>
          <span class="student">${escapeHtml(l.student)}</span>
          ${l.subject ? `<span class="subject">${escapeHtml(l.subject)}</span>` : ""}
        `;
        col.appendChild(card);
      });
    }
    cal.appendChild(col);
  });
}

async function refresh() {
  try {
    const data = await fetchLessons();
    clearLoadError();
    renderCalendar(data);
  } catch (err) {
    console.error(err);
    showLoadError(`Couldn't load the calendar: ${err.message}`);
  }
}

// Assistant form: the only way lessons get added, cancelled, or removed
// from this page. Rate limited to 5 requests/day per visitor, tracked
// server-side via a cookie.
const assistantForm = document.getElementById("assistant-form");
const assistantInput = document.getElementById("assistant-input");
const assistantSubmit = document.getElementById("assistant-submit");
const assistantReply = document.getElementById("assistant-reply");
const assistantUsage = document.getElementById("assistant-usage");

function renderUsage(usage) {
  if (!usage) return;
  assistantUsage.textContent = usage.limitReached
    ? `Daily limit reached (${usage.used}/${usage.limit}). Resets at midnight.`
    : `${usage.remaining} of ${usage.limit} requests left today.`;
  assistantUsage.classList.toggle("low", usage.remaining <= 1);

  if (usage.limitReached) {
    assistantInput.disabled = true;
    assistantSubmit.disabled = true;
    assistantInput.placeholder = "Daily limit reached, try again tomorrow";
  } else {
    assistantInput.disabled = false;
    assistantInput.placeholder = 'e.g. "add algebra with Sam every Tuesday 4-5pm"';
  }
}

async function fetchUsage() {
  try {
    const res = await fetch("/api/assistant");
    const data = await res.json();
    if (!res.ok) {
      console.error("Failed to load usage:", data.detail || data.error);
      return;
    }
    renderUsage(data);
  } catch (err) {
    console.error(err);
  }
}

assistantForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = assistantInput.value.trim();
  if (!message) return;

  assistantSubmit.disabled = true;
  assistantSubmit.textContent = "Thinking...";
  assistantReply.classList.remove("show", "error");

  try {
    const res = await fetch("/api/assistant", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    const data = await res.json();

    if (!res.ok) {
      assistantReply.textContent = data.detail || data.error || "Something went wrong.";
      assistantReply.classList.add("show", "error");
    } else {
      assistantReply.textContent = data.action?.reply || (data.applied ? "Done." : "Okay.");
      assistantReply.classList.add("show", data.limitReached ? "error" : "");
      if (data.applied) {
        assistantInput.value = "";
        refresh();
      }
    }
  } catch (err) {
    assistantReply.textContent = "Network error, please try again.";
    assistantReply.classList.add("show", "error");
  } finally {
    assistantSubmit.textContent = "Send";
    fetchUsage();
  }
});

refresh();
fetchUsage();
</script>

</body>
</html>
