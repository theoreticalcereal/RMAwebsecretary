<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lesson Secretary (Stage 5 — Rate Limited)</title>
<style>
  :root {
    --border: #d8dee4;
    --bg: #f7f8fa;
    --card: #ffffff;
    --accent: #2563eb;
    --accent-light: #eaf1ff;
    --text: #1f2430;
    --muted: #6b7280;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
  .stage-banner {
    background: #fff8e1;
    color: #92700a;
    padding: 8px 24px;
    font-size: 0.82rem;
    border-bottom: 1px solid #f0e0a8;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px;
  }

  .assistant-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .assistant-box form { display: flex; gap: 8px; }
  .assistant-box input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .assistant-box button {
    padding: 10px 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .assistant-reply {
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--accent-light);
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .assistant-reply.show { display: block; }
  .assistant-reply.error { background: #fdecea; color: var(--danger); }
  .assistant-usage {
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .assistant-usage.low { color: var(--danger); }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }
  .day-col {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    min-height: 140px;
  }
  .day-col h3 {
    margin: 0 0 8px;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .lesson-card {
    background: var(--accent-light);
    border-radius: 6px;
    padding: 6px 8px;
    margin-bottom: 6px;
    font-size: 0.82rem;
    position: relative;
  }
  .lesson-card .time { font-weight: 600; }
  .lesson-card .student { display: block; }
  .lesson-card .subject { color: var(--muted); font-size: 0.78rem; }
  .lesson-card .del-btn {
    position: absolute;
    top: 4px;
    right: 6px;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.8rem;
  }
  .lesson-card .del-btn:hover { color: var(--danger); }
  .empty { color: var(--muted); font-size: 0.8rem; }

  .add-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-top: 24px;
  }
  .add-form h2 { margin: 0 0 12px; font-size: 1rem; }
  .add-form .row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }
  .add-form input, .add-form select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .add-form button {
    padding: 9px 16px;
    background: var(--text);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  @media (max-width: 800px) {
    .calendar { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="stage-banner">
  Stage 5 (final): Assistant is capped at 5 requests/day, tracked server-side. Once hit, further requests are blocked and the maintainer is emailed once.
</div>

<header>
  <h1>Lesson Secretary</h1>
  <p>Weekly lesson schedule — add lessons manually below.</p>
</header>

<main>
  <div class="assistant-box">
    <form id="assistant-form">
      <input type="text" id="assistant-input" placeholder='e.g. "add algebra with Sam every Tuesday 4-5pm"' autocomplete="off" />
      <button type="submit" id="assistant-submit">Send</button>
    </form>
    <div class="assistant-reply" id="assistant-reply"></div>
    <div class="assistant-usage" id="assistant-usage"></div>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="add-form">
    <h2>Add a lesson manually</h2>
    <form id="manual-form">
      <div class="row">
        <input type="text" id="m-student" placeholder="Student name" required />
        <input type="text" id="m-subject" placeholder="Subject (optional)" />
        <select id="m-day" required>
          <option value="0">Monday</option>
          <option value="1">Tuesday</option>
          <option value="2">Wednesday</option>
          <option value="3">Thursday</option>
          <option value="4">Friday</option>
          <option value="5">Saturday</option>
          <option value="6">Sunday</option>
        </select>
        <input type="time" id="m-start" required />
        <input type="time" id="m-end" required />
      </div>
      <button type="submit">Add lesson</button>
    </form>
  </div>
</main>

<script>
const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

async function fetchLessons() {
  const res = await fetch("/api/lessons");
  if (!res.ok) throw new Error("Failed to load lessons");
  return res.json();
}

function formatTime(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderCalendar(data) {
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const byDay = {};
  for (let i = 0; i < 7; i++) byDay[i] = [];

  data.lessons
    .filter((l) => l.active !== false)
    .forEach((l) => byDay[l.day_of_week].push(l));

  for (let i = 0; i < 7; i++) byDay[i].sort((a, b) => a.start_time.localeCompare(b.start_time));

  DAY_NAMES.forEach((name, idx) => {
    const col = document.createElement("div");
    col.className = "day-col";
    const heading = document.createElement("h3");
    heading.textContent = name;
    col.appendChild(heading);

    const lessons = byDay[idx];
    if (lessons.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No lessons";
      col.appendChild(empty);
    } else {
      lessons.forEach((l) => {
        const card = document.createElement("div");
        card.className = "lesson-card";
        card.innerHTML = `
          <button class="del-btn" title="Delete" data-id="${l.id}">✕</button>
          <span class="time">${formatTime(l.start_time)}–${formatTime(l.end_time)}</span>
          <span class="student">${escapeHtml(l.student)}</span>
          ${l.subject ? `<span class="subject">${escapeHtml(l.subject)}</span>` : ""}
        `;
        col.appendChild(card);
      });
    }
    cal.appendChild(col);
  });

  cal.querySelectorAll(".del-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = Number(btn.dataset.id);
      if (!confirm("Delete this lesson?")) return;
      await fetch("/api/lessons", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
      refresh();
    });
  });
}

async function refresh() {
  try {
    const data = await fetchLessons();
    renderCalendar(data);
  } catch (err) {
    console.error(err);
  }
}

// Manual add form — now hitting the real backend from Stage 3 onward.
document.getElementById("manual-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    student: document.getElementById("m-student").value,
    subject: document.getElementById("m-subject").value,
    day_of_week: Number(document.getElementById("m-day").value),
    start_time: document.getElementById("m-start").value,
    end_time: document.getElementById("m-end").value,
    recurring: true,
  };
  const res = await fetch("/api/lessons", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || (data.errors && data.errors.join(", ")) || "Failed to add lesson");
    return;
  }
  e.target.reset();
  refresh();
});

// Assistant form — Stage 5: rate-limited to 5 requests/day, tracked server-side.
const assistantForm = document.getElementById("assistant-form");
const assistantInput = document.getElementById("assistant-input");
const assistantSubmit = document.getElementById("assistant-submit");
const assistantReply = document.getElementById("assistant-reply");
const assistantUsage = document.getElementById("assistant-usage");

function renderUsage(usage) {
  if (!usage) return;
  assistantUsage.textContent = usage.limitReached
    ? `Daily limit reached (${usage.used}/${usage.limit}) — resets at midnight.`
    : `${usage.remaining} of ${usage.limit} requests left today.`;
  assistantUsage.classList.toggle("low", usage.remaining <= 1);

  if (usage.limitReached) {
    assistantInput.disabled = true;
    assistantSubmit.disabled = true;
    assistantInput.placeholder = "Daily limit reached — try again tomorrow";
  } else {
    assistantInput.disabled = false;
    assistantInput.placeholder = 'e.g. "add algebra with Sam every Tuesday 4-5pm"';
  }
}

async function fetchUsage() {
  try {
    const res = await fetch("/api/assistant");
    if (!res.ok) return;
    const usage = await res.json();
    renderUsage(usage);
  } catch (err) {
    console.error(err);
  }
}

assistantForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = assistantInput.value.trim();
  if (!message) return;

  assistantSubmit.disabled = true;
  assistantSubmit.textContent = "Thinking...";
  assistantReply.classList.remove("show", "error");

  try {
    const res = await fetch("/api/assistant", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    const data = await res.json();

    if (!res.ok) {
      assistantReply.textContent = data.error || "Something went wrong.";
      assistantReply.classList.add("show", "error");
    } else {
      assistantReply.textContent = data.action?.reply || (data.applied ? "Done." : "Okay.");
      assistantReply.classList.add("show", data.limitReached ? "error" : "");
      if (data.applied) {
        assistantInput.value = "";
        refresh();
      }
    }
  } catch (err) {
    assistantReply.textContent = "Network error — please try again.";
    assistantReply.classList.add("show", "error");
  } finally {
    assistantSubmit.textContent = "Send";
    fetchUsage();
  }
});

refresh();
fetchUsage();
</script>

</body>
</html>
