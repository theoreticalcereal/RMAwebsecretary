<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lesson Secretary</title>
<style>
  :root {
    --border: #d8dee4;
    --bg: #f7f8fa;
    --card: #ffffff;
    --accent: #2563eb;
    --accent-light: #eaf1ff;
    --text: #1f2430;
    --muted: #6b7280;
    --danger: #dc2626;
    --success: #0f7a4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px;
  }

  .assistant-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 24px;
  }

  .hidden { display: none !important; }

  .auth-box h2 { margin: 0 0 10px; font-size: 1rem; }
  .auth-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .auth-box input {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .auth-box button {
    padding: 10px 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .auth-status {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 8px;
    min-height: 1.1em;
  }

  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
    font-size: 0.85rem;
  }
  .chat-meta { color: var(--muted); }
  .chat-meta .email { font-weight: 600; color: var(--text); }
  .chat-header button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .assistant-conversation {
    min-height: 140px;
    max-height: 380px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    background: #fbfcff;
    margin-bottom: 10px;
  }
  .message {
    margin-bottom: 10px;
    line-height: 1.35;
    font-size: 0.9rem;
  }
  .bubble {
    border-radius: 10px;
    padding: 8px 10px;
    display: inline-block;
    max-width: 90%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .message.user .bubble {
    background: #dfeafe;
    color: #1d3f90;
  }
  .message.assistant .bubble {
    background: var(--card);
    border: 1px solid var(--border);
  }
  .message.error .bubble {
    background: #fdecea;
    border-color: #fecaca;
    color: var(--danger);
  }
  .message.system .bubble {
    background: #eef6ff;
    border: 1px solid #cfe2ff;
    color: var(--muted);
  }
  .message code { font-family: ui-monospace, Menlo, Consolas, monospace; }

  .assistant-box form { display: flex; gap: 8px; }
  .assistant-box input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .assistant-box button.send-btn {
    padding: 10px 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .assistant-box button:disabled { opacity: 0.6; cursor: default; }

  .assistant-usage {
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .assistant-usage.low { color: var(--danger); }
  .assistant-usage.ok { color: var(--success); }

  .request-section {
    margin-top: 12px;
  }
  .request-section h3 {
    margin: 0 0 8px;
    font-size: 0.95rem;
  }
  .requests-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .requests-table th,
  .requests-table td {
    text-align: left;
    padding: 7px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .requests-table th { background: #f0f2f5; color: var(--muted); }
  .requests-table tr:last-child td { border-bottom: none; }
  .requests-empty { color: var(--muted); font-size: 0.78rem; margin-top: 6px; }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }
  .day-col {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    min-height: 140px;
  }
  .day-col h3 {
    margin: 0 0 8px;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .lesson-card {
    background: var(--accent-light);
    border-radius: 6px;
    padding: 6px 8px;
    margin-bottom: 6px;
    font-size: 0.82rem;
  }
  .lesson-card .time { font-weight: 600; }
  .lesson-card .student { display: block; }
  .lesson-card .subject { color: var(--muted); font-size: 0.78rem; }
  .empty { color: var(--muted); font-size: 0.8rem; }

  .load-error {
    background: #fdecea;
    color: var(--danger);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }
  .load-error.show { display: block; }

  @media (max-width: 800px) {
    .calendar { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1>Lesson Secretary</h1>
  <p>Weekly lesson schedule. Sign in with email, then use the assistant to add, cancel, or check a lesson.</p>
</header>

<main>
  <div class="load-error" id="load-error"></div>

  <div class="assistant-box">
    <section class="auth-box" id="auth-view">
      <h2>Sign in to continue</h2>
      <form id="email-form" class="auth-row">
        <input id="email-input" type="email" placeholder="you@example.com" required autocomplete="email" />
        <button type="submit" id="request-btn">Send code</button>
      </form>
      <form id="verify-form" class="auth-row hidden">
        <input id="code-input" type="text" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter 6-digit code" required />
        <button type="submit" id="verify-btn">Verify</button>
      </form>
      <div class="auth-status" id="auth-status"></div>
    </section>

    <section id="chat-view" class="hidden">
      <div class="chat-header">
        <div class="chat-meta">Signed in as <span id="chat-user" class="email"></span></div>
        <button id="logout-btn" type="button">Log out</button>
      </div>
      <div id="conversation" class="assistant-conversation" aria-live="polite"></div>
      <form id="assistant-form">
        <input type="text" id="assistant-input" placeholder='e.g. "add algebra with Sam every Tuesday 4-5pm"' autocomplete="off" />
        <button class="send-btn" type="submit" id="assistant-submit">Send</button>
      </form>
      <div class="assistant-usage" id="assistant-usage"></div>
      <section class="request-section" id="request-section">
        <h3>Recent requests</h3>
        <table class="requests-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Type</th>
              <th>Status</th>
              <th>Request</th>
            </tr>
          </thead>
          <tbody id="requests-tbody"></tbody>
        </table>
        <div class="requests-empty" id="requests-empty">No recent requests</div>
      </section>
    </section>
  </div>

  <div class="calendar" id="calendar"></div>
</main>

<script>
const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

const ASSISTANT_REQUEST_TIMEOUT_MS = 20000;

const state = {
  user: null,
  calendarRefreshId: null,
};

function formatTime(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = String(str);
  return div.innerHTML;
}

function showLoadError(message) {
  const el = document.getElementById("load-error");
  el.textContent = message;
  el.classList.add("show");
}

function clearLoadError() {
  document.getElementById("load-error").classList.remove("show");
}

function appendMessage(kind, text, isError = false) {
  const conversation = document.getElementById("conversation");
  const row = document.createElement("div");
  row.className = `message ${kind}${isError ? " error" : ""}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  conversation.appendChild(row);
  conversation.scrollTop = conversation.scrollHeight;
  return row;
}

function setAuthError(message) {
  const status = document.getElementById("auth-status");
  status.textContent = message;
  if (message) status.style.color = "var(--danger)";
}

function setAuthInfo(message) {
  const status = document.getElementById("auth-status");
  status.textContent = message || "";
  status.style.color = "var(--muted)";
}

function setSessionView(showSignedIn, user) {
  const authView = document.getElementById("auth-view");
  const chatView = document.getElementById("chat-view");
  const conversation = document.getElementById("conversation");
  const usage = document.getElementById("assistant-usage");
  if (showSignedIn) {
    authView.classList.add("hidden");
    chatView.classList.remove("hidden");
    document.getElementById("chat-user").textContent = user.email;
    usage.textContent = "";
    state.user = user;
    if (!conversation.dataset.ready) {
      appendMessage("system", `You are signed in as ${user.email}. You can now chat with the assistant.`);
      conversation.dataset.ready = "1";
    }
    document.getElementById("request-section").classList.remove("hidden");
    if (!state.calendarRefreshId) {
      state.calendarRefreshId = setInterval(() => {
        if (document.visibilityState === "visible") refresh();
      }, 15000);
    }
  } else {
    if (state.calendarRefreshId) {
      clearInterval(state.calendarRefreshId);
      state.calendarRefreshId = null;
    }
    authView.classList.remove("hidden");
    chatView.classList.add("hidden");
    document.getElementById("verify-form").classList.add("hidden");
    document.getElementById("code-input").value = "";
    document.getElementById("email-input").value = "";
    setAuthInfo("");
    conversation.innerHTML = "";
    conversation.removeAttribute("data-ready");
    document.getElementById("request-section").classList.add("hidden");
    const requestsTbody = document.getElementById("requests-tbody");
    const requestsEmpty = document.getElementById("requests-empty");
    requestsTbody.innerHTML = "";
    requestsEmpty.style.display = "block";
    state.user = null;
  }
}

function renderCalendar(data) {
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const byDay = {};
  for (let i = 0; i < 7; i++) byDay[i] = [];

  data.lessons
    .filter((l) => l.active !== false)
    .forEach((l) => byDay[l.day_of_week].push(l));

  for (let i = 0; i < 7; i++) byDay[i].sort((a, b) => a.start_time.localeCompare(b.start_time));

  DAY_NAMES.forEach((name, idx) => {
    const col = document.createElement("div");
    col.className = "day-col";
    const heading = document.createElement("h3");
    heading.textContent = name;
    col.appendChild(heading);

    const lessons = byDay[idx];
    if (lessons.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No lessons";
      col.appendChild(empty);
    } else {
      lessons.forEach((l) => {
        const card = document.createElement("div");
        card.className = "lesson-card";
        card.innerHTML = `
          <span class="time">${formatTime(l.start_time)}–${formatTime(l.end_time)}</span>
          <span class="student">${escapeHtml(l.student)}</span>
          ${l.subject ? `<span class="subject">${escapeHtml(l.subject)}</span>` : ""}
        `;
        col.appendChild(card);
      });
    }
    cal.appendChild(col);
  });
}

async function refresh() {
  try {
    const res = await fetch("/api/lessons");
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.detail || data.error || `Failed to load lessons (HTTP ${res.status})`);
    }
    clearLoadError();
    renderCalendar(data);
  } catch (err) {
    console.error(err);
    showLoadError(`Couldn't load the calendar: ${err.message}`);
  }
}

function renderUsage(usage) {
  const assistantUsage = document.getElementById("assistant-usage");
  const assistantInput = document.getElementById("assistant-input");
  const assistantSubmit = document.getElementById("assistant-submit");
  if (!usage) return;
  assistantUsage.textContent = usage.limitReached
    ? `Daily limit reached (${usage.used}/${usage.limit}). Resets at midnight.`
    : `${usage.remaining} of ${usage.limit} requests left today.`;
  assistantUsage.classList.toggle("low", usage.remaining <= 1);
  assistantUsage.classList.toggle("ok", usage.remaining > 1);

  if (usage.limitReached) {
    assistantInput.disabled = true;
    assistantSubmit.disabled = true;
    assistantInput.placeholder = "Daily limit reached, try again tomorrow";
  } else {
    assistantInput.disabled = false;
    assistantSubmit.disabled = false;
    assistantInput.placeholder = 'e.g. "add algebra with Sam every Tuesday 4-5pm"';
  }
}

function formatRequestStatus(change) {
  const status = String(change.status || "pending").toLowerCase();
  if (status === "approved") return "approved";
  if (status === "rejected") return "rejected";
  if (status === "pending") return "pending";
  return `status: ${status}`;
}

function renderUserRequests(usage) {
  const tbody = document.getElementById("requests-tbody");
  const empty = document.getElementById("requests-empty");
  const requests = Array.isArray(usage?.requests) ? usage.requests : [];
  tbody.innerHTML = "";

  if (!requests.length) {
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";
  const sorted = requests
    .slice()
    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

  sorted.forEach((change) => {
    const tr = document.createElement("tr");
    const action = change?.action?.action || "unknown";
    const requestText = change.requestMessage || "No message";
    tr.innerHTML = `
      <td>${escapeHtml(String(change.createdAt || "").replace("T", " ").slice(0, 16))}</td>
      <td>${escapeHtml(action)}</td>
      <td>${escapeHtml(formatRequestStatus(change))}</td>
      <td>${escapeHtml(requestText)}</td>
    `;
    tbody.appendChild(tr);
  });
}

async function fetchUsage() {
  try {
    const res = await fetch("/api/assistant", { credentials: "include" });
    const data = await res.json();
    if (!res.ok) {
      if (res.status === 401) {
        setSessionView(false);
        return;
      }
      console.error("Failed to load usage:", data.detail || data.error);
      return;
    }
    renderUsage(data);
    renderUserRequests(data);
  } catch (err) {
    console.error(err);
  }
}

async function refreshSession() {
  try {
    const res = await fetch("/api/auth-session", { credentials: "include" });
    if (!res.ok) {
      setSessionView(false);
      return;
    }
    const data = await res.json();
    if (!data.authenticated) {
      setSessionView(false);
      return;
    }
    setSessionView(true, data.user);
    fetchUsage();
  } catch (err) {
    console.error("Failed to check session:", err);
    setSessionView(false);
  }
}

document.getElementById("email-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email-input").value.trim();
  const btn = document.getElementById("request-btn");
  setAuthInfo("");
  if (!email) {
    setAuthError("Enter your email first.");
    return;
  }
  btn.disabled = true;
  btn.textContent = "Sending...";
  try {
    const res = await fetch("/api/auth-request-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.error || "Could not send code.");
    setAuthInfo(`A 6-digit code was sent to ${email}.`);
    document.getElementById("verify-form").classList.remove("hidden");
  } catch (err) {
    setAuthError(err.message || "Could not send code.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Send code";
  }
});

document.getElementById("verify-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email-input").value.trim();
  const code = document.getElementById("code-input").value.trim();
  const btn = document.getElementById("verify-btn");
  if (!email || !code) {
    setAuthError("Email and code are required.");
    return;
  }
  btn.disabled = true;
  btn.textContent = "Verifying...";
  try {
    const res = await fetch("/api/auth-verify-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, code }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.error || "Could not verify code.");
    setSessionView(true, data.user);
    appendMessage("system", `Signed in successfully as ${data.user.email}.`, false);
    fetchUsage();
  } catch (err) {
    setAuthError(err.message || "Could not verify code.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Verify";
  }
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  try {
    await fetch("/api/auth-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ action: "logout" }),
    });
  } finally {
    setSessionView(false);
  }
});

const assistantForm = document.getElementById("assistant-form");
const assistantInput = document.getElementById("assistant-input");
const assistantSubmit = document.getElementById("assistant-submit");

assistantForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = assistantInput.value.trim();
  if (!message || !state.user) return;

  const formSubmit = assistantSubmit;
  appendMessage("user", message);
  const assistantRow = appendMessage("assistant", "Thinking...");
  assistantInput.value = "";
  formSubmit.disabled = true;
  formSubmit.textContent = "Thinking...";
  assistantInput.disabled = true;

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), ASSISTANT_REQUEST_TIMEOUT_MS);
    const res = await fetch("/api/assistant", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
      signal: controller.signal,
    });
    clearTimeout(timeoutId);
    const data = await res.json();

    assistantRow.querySelector(".bubble").textContent = "";
    if (!res.ok) {
      if (res.status === 401) {
        setSessionView(false);
        assistantRow.querySelector(".bubble").textContent = "Session expired. Please sign in again.";
        assistantRow.classList.add("error");
        return;
      }
      const fallback = data?.detail || data?.error || data?.action?.reply || "Something went wrong.";
      assistantRow.querySelector(".bubble").textContent = fallback;
      assistantRow.classList.add("error");
      return;
    }

    const reply = data.action?.reply || (data.applied ? "Done." : "Okay.");
    const isLimitReached = data.limitReached;
    assistantRow.querySelector(".bubble").textContent = reply;
    if (isLimitReached) assistantRow.classList.add("error");

    if (data.applied || data.pending) {
      await refresh();
    }
  } catch (err) {
    const timedOut = err.name === "AbortError";
    console.error("Network-level failure calling /api/assistant:", err);
    const messageText = timedOut
      ? "The request took longer than expected. If this was a scheduling request, it may still apply; usage will refresh in a moment."
      : "Network error, please check your connection and try again.";
    assistantRow.querySelector(".bubble").textContent = messageText;
    assistantRow.classList.add("error");
    if (timedOut) {
      setTimeout(fetchUsage, 1200);
      setTimeout(fetchUsage, 3500);
      setTimeout(refresh, 1200);
      setTimeout(refresh, 3600);
    }
  } finally {
    formSubmit.disabled = false;
    formSubmit.textContent = "Send";
    assistantInput.disabled = false;
    fetchUsage();
  }
});

refresh();
refreshSession();
</script>

</body>
</html>
